name: Diagnose runner allocation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/runner-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  checks: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read allocation failures and remove superseded queued builds
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def api(path, method='GET'):
              request = urllib.request.Request(base + path, method=method, headers={
                  'Authorization':'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json','User-Agent':'runner-diagnostics'})
              with urllib.request.urlopen(request) as response:
                  body = response.read()
                  return json.loads(body) if body else {}
          for run in [40331522196,40335690938,40336402361,40336691378]:
              result = api('/actions/runs/' + str(run))
              print('RUN',run,result['status'],result['conclusion'])
              for job in api('/actions/runs/' + str(run) + '/jobs')['jobs']:
                  print('JOB',job['id'],job['status'],job.get('labels'),job.get('runner_name'))
                  try:
                      check = api('/check-runs/' + str(job['id']))
                      print('CHECK OUTPUT',check.get('output'))
                      print('ANNOTATIONS',api('/check-runs/' + str(job['id']) + '/annotations'))
                  except urllib.error.HTTPError as error: print('Check read status', error.code)
          for run in [40335690938,40335972159,40336619015]:
              result = api('/actions/runs/' + str(run))
              if result['status'] == 'queued':
                  api('/actions/runs/' + str(run) + '/cancel','POST')
                  print('Cancelled superseded queued run',run)
          PY
