name: iOS conversion feasibility and unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-conversion.yml'
      - 'tools/**'

permissions:
  contents: read

jobs:
  convert:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Port0r official release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,shutil
          api='https://api.github.com/repos/jacquesdupontd/port0r/releases/tags/mac-v0.1.0'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'segarally-ios-probe','Accept':'application/vnd.github+json'}
          with urllib.request.urlopen(urllib.request.Request(api,headers=headers)) as r: release=json.load(r)
          assets=[a for a in release['assets'] if a['name']=='Port0r-SegaRally-Mac-v0.1.0.tar.gz']
          if len(assets)!=1: raise SystemExit('Expected official release asset unavailable')
          with urllib.request.urlopen(urllib.request.Request(assets[0]['browser_download_url'],headers=headers)) as r,open('port0r.tar.gz','wb') as f: shutil.copyfileobj(r,f)
          PY
          mkdir extracted
          tar -xzf port0r.tar.gz -C extracted
          test -d 'extracted/Port0r Rally.app'
      - name: Fetch compatibility conversion source
        run: git clone --depth 1 https://github.com/zorrobyte/macos-on-ios-public.git compatibility
      - name: Pin converter and prepare ROM-free source
        run: |
          git -C compatibility checkout c2562a333d4de4c08da4ceb4a4f1485bddb84e04
          echo '1e275f547a9f641b49488fd37368e918d45ae5fd4ce30326dd3688cf9899dec0  port0r.tar.gz' | shasum -a 256 -c -
          python3 tools/prepare.py
      - name: Check Xcode and SDK availability
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
          python3 compatibility/tools/convert_app.py --help
      - name: Try conversion without Apple developer credentials
        id: convert
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python3 compatibility/tools/convert_app.py 'extracted/Port0r Rally.app' build/SegaRally.app com.segarally.port0r.ios --profile /dev/null --identity - --team UNSIGNED --no-metal-hud --redirect /Library/Application\ Support/Port0r=Documents/Port0r --redirect /Downloads=Documents/Downloads 2>&1 | tee build/conversion.log
      - name: Verify SDL display metadata and CoreFoundation ownership
        run: python3 tools/smoke_display.py
      - name: Verify SDL icon bitmap allocation and copy
        run: python3 tools/smoke_bitmap.py
      - name: Verify SDL default audio device bridge
        run: python3 tools/smoke_audio.py
      - name: Verify iOS fullscreen policy for the original Mac SDL ABI
        run: python3 tools/smoke_sdl_policy.py
      - name: Verify C++ ROM import paths and touch input release
        run: python3 tools/smoke_paths_touch.py
      - name: Preserve component license notices
        run: |
          curl -fL https://raw.githubusercontent.com/jacquesdupontd/port0r/main/THIRD-PARTY-NOTICES.txt -o build/SegaRally.app/THIRD-PARTY-NOTICES.txt
          cp compatibility/LICENSE build/SegaRally.app/COMPATIBILITY-LICENSE.txt
      - name: Validate and package LiveContainer IPA
        run: python3 tools/package.py | tee build/validation.log
      - name: Upload validated IPA
        uses: actions/upload-artifact@v4
        with:
          name: SegaRally-LiveContainer-UNSIGNED
          path: build/SegaRally-LiveContainer-UNSIGNED.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: segarally-ios-conversion-diagnostics
          path: |
            build/validation.json
            build/validation.log
            build/conversion.log
            build/shims/*.m
          if-no-files-found: warn
          retention-days: 7
