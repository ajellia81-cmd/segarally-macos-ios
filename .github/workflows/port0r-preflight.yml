name: Port0r macOS ARM64 preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download official Port0r Mac release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, os
          api='https://api.github.com/repos/jacquesdupontd/port0r/releases/tags/mac-v0.1.0'
          req=urllib.request.Request(api,headers={'User-Agent':'segarally-macos-ios-preflight','Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req) as r: release=json.load(r)
          assets=[a for a in release.get('assets',[]) if a['name'].endswith('.tar.gz') and 'Mac' in a['name']]
          if not assets: raise SystemExit('No official Mac tar.gz asset in release; do not use an unverified mirror.')
          asset=assets[0]
          print('Official asset:',asset['name'],'bytes:',asset['size'])
          req=urllib.request.Request(asset['browser_download_url'],headers={'User-Agent':'segarally-macos-ios-preflight'})
          with urllib.request.urlopen(req) as r,open('port0r-mac.tar.gz','wb') as f:
              import shutil;shutil.copyfileobj(r,f)
          PY
      - name: Inspect app bundle and arm64 architecture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          tar -xzf port0r-mac.tar.gz -C extracted
          find extracted -maxdepth 5 -name Info.plist -print
          APP=$(find extracted -name '*.app' -type d -print -quit)
          test -n "$APP" || { echo 'No .app found'; exit 1; }
          echo "App: $APP"
          EXE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Contents/Info.plist")
          echo "Executable: $EXE"
          file "$APP/Contents/MacOS/$EXE"
          lipo -archs "$APP/Contents/MacOS/$EXE" | tee architectures.txt
          grep -q arm64 architectures.txt
          otool -L "$APP/Contents/MacOS/$EXE" | head -80
          echo 'ARM64 preflight passed; iOS conversion and device execution NOT yet tested.'
