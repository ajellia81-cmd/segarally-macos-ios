name: Original-rendering stable IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/texture-sync-comparison.yml'
      - 'tools/repack_texture_comparison.py'
permissions:
  contents: read
  actions: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download exact previously validated IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 40317867463 --repo ajellia81-cmd/segarally-macos-ios --name SegaRally-LiveContainer-UNSIGNED --dir base
      - name: Package original renderer defaults and verify every payload file
        run: python3 tools/repack_texture_comparison.py --original-rendering
      - uses: actions/upload-artifact@v4
        with:
          name: SegaRally-original-rendering-STABLE-UNSIGNED
          path: build/SegaRally-LiveContainer-STABLE-UNSIGNED.ipa
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: texture-comparison-validation
          path: build/texture-comparison-validation.json
          if-no-files-found: error
          retention-days: 7
      - name: Cancel only superseded queued texture experiment builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          base='https://api.github.com/repos/ajellia81-cmd/segarally-macos-ios/actions/runs/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'segarally-stable-package'}
          for run in [40328110559,40329391560,40330904777]:
              with urllib.request.urlopen(urllib.request.Request(base+str(run),headers=headers)) as response: data=json.load(response)
              if data['status']!='queued':
                  print('Preserved run',run,'status',data['status']);continue
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+str(run)+'/cancel',data=b'',headers=headers,method='POST')): pass
                  print('Cancelled superseded queued experiment',run)
              except urllib.error.HTTPError as error:
                  if error.code==409: print('Run state changed before cancellation',run)
                  else: raise
          PY
